<meta name="theme-color" content="#f7f8fb">
<meta property="og:title" content="Nguyễn Hữu Văn">
<meta property="og:description" content="MMO · Dịch vụ mạng xã hội · Freelancer · AI">

<style>
/* =========================================================
   1. TOKENS
   ========================================================= */
:root{
  --blue:#2563eb;          /* MÀU CHỦ ĐẠO */
  --blue-2:#06b6d4;
  --blue-soft:#eaf1ff;
  --bg:#f7f8fb;
  --surface:#ffffff;
  --ink:#0f172a;
  --ink-2:#334155;
  --muted:#64748b;
  --line:#e5e9f0;
  --r:18px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
  --shadow-lg:0 2px 4px rgba(15,23,42,.04),0 24px 48px -20px rgba(37,99,235,.28);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"Be Vietnam Pro","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
html[lang="ja"] body{font-family:"Noto Sans JP","Be Vietnam Pro",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
::selection{background:var(--blue);color:#fff}

/* =========================================================
   2. BACKGROUND DECOR
   ========================================================= */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg .grid{position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 30%,transparent 75%);opacity:.7}
.bg .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 18s ease-in-out infinite}
.bg .b1{width:420px;height:420px;background:#c7dbff;top:-120px;right:-80px}
.bg .b2{width:360px;height:360px;background:#cff4fb;top:260px;left:-140px;animation-delay:-6s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.08)}}

/* =========================================================
   3. NAV
   ========================================================= */
.lang{position:fixed;top:18px;right:20px;z-index:60;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:1px solid var(--line);box-shadow:0 10px 26px -12px rgba(15,23,42,.3)}
.lang button{width:34px;height:24px;padding:0;border:0;border-radius:6px;overflow:hidden;background:none;opacity:.5;filter:saturate(.6);
  box-shadow:0 0 0 1px rgba(15,23,42,.12);transition:opacity .2s,filter .2s,transform .2s var(--ease),box-shadow .2s}
.lang button svg{display:block;width:100%;height:100%}
.lang button:hover{opacity:.9;filter:none;transform:translateY(-1px)}
.lang button.active{opacity:1;filter:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}

/* =========================================================
   4. LAYOUT
   ========================================================= */
main{max-width:960px;margin:0 auto;padding:0 22px}
section{padding:84px 0 0;scroll-margin-top:70px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--blue);font-weight:500;letter-spacing:.04em;margin-bottom:10px}
h2{font-size:clamp(26px,4.5vw,36px);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-bottom:28px}

/* =========================================================
   5. HERO
   ========================================================= */
.hero{padding-top:88px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.status{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:1px solid #d6e4ff;border-radius:999px;padding:6px 14px 6px 12px;margin-bottom:22px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}70%{box-shadow:0 0 0 9px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.hello{font-size:18px;color:var(--muted);font-weight:500}
h1{font-size:clamp(42px,8vw,72px);line-height:1.02;font-weight:800;letter-spacing:-.045em;margin:6px 0 16px}
h1 .grad{background:linear-gradient(100deg,var(--ink) 30%,var(--blue) 70%,var(--blue-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.typed{font-size:clamp(18px,3vw,22px);font-weight:600;color:var(--ink-2);min-height:1.6em}
.typed .w{color:var(--blue)}
.typed .caret{display:inline-block;width:2px;height:1.05em;background:var(--blue);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bio{max-width:540px;margin-top:18px;color:var(--ink-2);font-size:16.5px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.social{display:flex;flex-wrap:wrap;gap:10px;margin:-2px 0 20px}
.social a{--c:var(--ink);position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .25s var(--ease),background .25s,color .25s,border-color .25s,box-shadow .25s}
.social a svg{width:20px;height:20px;fill:currentColor}
.social a:hover{transform:translateY(-4px);background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 12px 22px -10px var(--c)}
.social a::after{content:attr(data-label);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);white-space:nowrap;
  font-size:12px;font-weight:600;color:#fff;background:var(--ink);padding:4px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.social a:hover::after{opacity:1;transform:translate(-50%,0)}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 20px;border-radius:12px;border:1px solid transparent;transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn-p{background:var(--ink);color:#fff;box-shadow:0 10px 24px -12px rgba(15,23,42,.6)}
.btn-p:hover{transform:translateY(-2px);background:var(--blue);box-shadow:0 14px 28px -12px var(--blue)}
.btn-s{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-s:hover{transform:translateY(-2px);border-color:#c9d6ee}

.avatar{width:220px;aspect-ratio:1;border-radius:32px;position:relative;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;font-size:96px;font-weight:800;letter-spacing:-.05em;
  box-shadow:var(--shadow-lg);transform-style:preserve-3d}
.avatar::before{content:"";position:absolute;inset:-10px;border-radius:40px;border:1.5px dashed #bcd0f5;animation:spin 40s linear infinite}
.avatar .chip{position:absolute;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);letter-spacing:0;transform:translateZ(40px)}
.avatar .c1{top:18px;left:-34px}.avatar .c2{bottom:28px;right:-38px}.avatar .c3{bottom:-14px;left:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* =========================================================
   6. STATS
   ========================================================= */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:64px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:clamp(30px,5vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;color:var(--blue)}
.stat > span:not(.glare){font-size:14px;color:var(--muted);font-weight:500}

/* =========================================================
   7. CARDS (3D tilt)
   ========================================================= */
.tilt{position:relative;transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .3s,border-color .3s;will-change:transform}
.tilt.active{transition:transform .08s linear,box-shadow .3s,border-color .3s}
.tilt .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%),rgba(37,99,235,.13),transparent 45%)}
.tilt:hover .glare{opacity:1}
.tilt:hover{box-shadow:var(--shadow-lg);border-color:#cfdcf5}
.tilt .lift{transform:translateZ(28px)}

.services{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.svc .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;color:var(--blue);background:var(--blue-soft)}
.svc .ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svc h3{font-size:18px;font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.svc p{color:var(--muted);font-size:15px}
.svc .num{position:absolute;top:22px;right:24px;font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#b6c2d6}

/* =========================================================
   8. SKILLS
   ========================================================= */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 40px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px;box-shadow:var(--shadow)}
.sk .top{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:9px}
.sk .top span:last-child{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--blue)}
.bar{height:8px;border-radius:99px;background:#eef2f8;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--blue-2));transition:width 1.4s var(--ease);position:relative}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 2.4s 1.4s infinite}
@keyframes shine{to{transform:translateX(100%)}}

/* =========================================================
   9. PROJECTS & CONTACT
   ========================================================= */
.projects{display:grid;gap:16px}
.proj{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.proj .thumb{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(140deg,#ef4444,#f97316)}
.proj h3{font-size:18px;font-weight:700;letter-spacing:-.015em}
.proj p{color:var(--muted);font-size:14.5px}
.proj .url{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--blue);margin-top:4px;display:inline-block}
.go{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink);transition:background .25s,color .25s,transform .35s var(--ease)}
.go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.proj:hover .go,.ct:hover .go{background:var(--blue);color:#fff;border-color:var(--blue);transform:rotate(45deg)}

.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ct{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ct .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg);flex:none}
.ct .ic svg{width:21px;height:21px;fill:currentColor}
.ct .tx{flex:1;min-width:0}
.ct .tx b{display:block;font-size:15.5px}
.ct .tx span{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

footer{max-width:960px;margin:96px auto 0;padding:26px 22px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.totop{color:var(--ink);font-weight:600}

/* =========================================================
   10. MOTION
   ========================================================= */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.swap{animation:swap .4s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}html{scroll-behavior:auto}
}

/* =========================================================
   11. RESPONSIVE
   ========================================================= */
@media (max-width:820px){
  .lang{top:12px;right:12px}
  .hero{grid-template-columns:1fr;padding-top:40px}
  .hero .art{order:-1}
  .avatar{width:150px;font-size:64px;border-radius:26px}
  .avatar::before{border-radius:32px}
  .avatar .chip{font-size:11.5px;padding:5px 10px}
  .avatar .c1{left:auto;right:-110px;top:14px}.avatar .c2{right:-118px;bottom:56px}.avatar .c3{left:auto;right:-80px;bottom:6px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .services,.skills{grid-template-columns:1fr}
  section{padding-top:68px}
}
@media (max-width:420px){.proj{grid-template-columns:auto 1fr}.proj .go{display:none}}
</style>
</head>

const BRAND = { facebook:"#1877f2", tiktok:"#111111", zalo:"#0068ff", telegram:"#229ed9", instagram:"#e1306c", youtube:"#ff0000", github:"#181717", x:"#000000", email:"#2563eb" };
const LABEL = { facebook:"Facebook", tiktok:"TikTok", zalo:"Zalo", telegram:"Telegram", instagram:"Instagram", youtube:"YouTube", github:"GitHub", x:"X" };
const ARROW = '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg>';

/* =========================================================
   RENDER
   ========================================================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let LANG = "vi";

function render(lang, swap) {
  LANG = lang; const t = T[lang];
  document.documentElement.lang = lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  $$(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  movePill();

  $$("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  $("#name").textContent = PROFILE.name;
  $("#initial").textContent = PROFILE.initial;
  document.title = `${PROFILE.name} — ${t.words.join(" · ")}`;

  $("#stats").innerHTML = PROFILE.stats.map(s =>
    `<div class="stat tilt rv" data-tilt="8"><span class="glare"></span><b><span class="count" data-n="${s.n}">${counted ? s.n : 0}</span><em>${esc(s.suf)}</em></b><span>${esc(s[lang])}</span></div>`).join("");

  $("#svc").innerHTML = SERVICES.map((s, i) =>
    `<div class="svc tilt rv" data-tilt="7"><span class="glare"></span><span class="num">0${i + 1}</span>
       <div class="lift"><div class="ico"><svg viewBox="0 0 24 24">${s.icon}</svg></div><h3>${esc(s[lang][0])}</h3><p>${esc(s[lang][1])}</p></div></div>`).join("");

  $("#sk").innerHTML = PROFILE.skills.map(s =>
    `<div class="sk"><div class="top"><span>${esc(s.name)}</span><span>${s.p}%</span></div><div class="bar"><i data-p="${s.p}" style="width:${barsDone ? s.p : 0}%"></i></div></div>`).join("");

  $("#pj").innerHTML = PROFILE.projects.map(p =>
    `<a class="proj tilt rv" data-tilt="5" href="${esc(p.link)}" target="_blank" rel="noopener"><span class="glare"></span>
       <span class="thumb lift">${esc(p.thumb)}</span>
       <span><h3>${esc(p.name)}</h3><p>${esc(p.desc[lang])}</p><span class="url">${esc(pretty(p.link))}</span></span>
       <span class="go">${ARROW}</span></a>`).join("");

  $("#ct").innerHTML = Object.entries(PROFILE.socials).filter(([, u]) => u).map(([k, u]) => {
    const isMail = k === "email";
    const href = isMail ? "mailto:" + u : u;
    return `<a class="ct tilt rv" data-tilt="6" href="${esc(href)}" ${isMail ? "" : 'target="_blank" rel="noopener"'}><span class="glare"></span>
       <span class="ic"><svg viewBox="0 0 24 24">${ICON[k]}</svg></span>
       <span class="tx"><b>${isMail ? t.email : LABEL[k]}</b><span>${esc(isMail ? u : pretty(u))}</span></span>
       <span class="go">${ARROW}</span></a>`;
  }).join("");

  $("#social").innerHTML = Object.entries(PROFILE.socials).filter(([, u]) => u).map(([k, u]) => {
    const isMail = k === "email", label = isMail ? t.email : LABEL[k];
    return `<a href="${esc(isMail ? "mailto:" + u : u)}" ${isMail ? "" : 'target="_blank" rel="noopener"'} style="--c:${BRAND[k]}" data-label="${esc(label)}" aria-label="${esc(label)}"><svg viewBox="0 0 24 24">${ICON[k]}</svg></a>`;
  }).join("");

  $("#copy").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;

  initTilt(); observe();
  if (swap) { $$("main, footer").forEach(el => { el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); }); }
  restartTyping();
}

/* Lang pill */
function movePill() {
  const a = $(".lang button.active"), pill = $(".lang .pill");
  if (a && pill) { pill.style.left = a.offsetLeft + "px"; pill.style.width = a.offsetWidth + "px"; }
}

/* =========================================================
   TYPEWRITER
   ========================================================= */
let typeTimer;
function restartTyping() {
  clearTimeout(typeTimer);
  const el = $("#typed"), words = T[LANG].words;
  if (reduced) { el.textContent = words[0]; return; }
  let w = 0, i = 0, del = false;
  (function tick() {
    const word = words[w];
    i += del ? -1 : 1;
    el.textContent = word.slice(0, i);
    let delay = del ? 38 : 85;
    if (!del && i === word.length) { del = true; delay = 1600; }
    else if (del && i === 0) { del = false; w = (w + 1) % words.length; delay = 350; }
    typeTimer = setTimeout(tick, delay);
  })();
}

/* =========================================================
   3D TILT + GLARE
   ========================================================= */
const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
function initTilt() {
  if (reduced || !canHover) return;
  $$(".tilt").forEach(card => {
    if (card._tilt) return; card._tilt = true;
    const max = +card.dataset.tilt || 8;
    card.addEventListener("pointerenter", () => card.classList.add("active"));
    card.addEventListener("pointermove", e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      card.style.transform = `perspective(900px) rotateX(${(0.5 - y) * max}deg) rotateY(${(x - 0.5) * max}deg) translateZ(0)`;
      card.style.setProperty("--gx", x * 100 + "%");
      card.style.setProperty("--gy", y * 100 + "%");
    });
    card.addEventListener("pointerleave", () => { card.classList.remove("active"); card.style.transform = ""; });
  });
}

/* =========================================================
   SCROLL: reveal, counters, bars
   ========================================================= */
let counted = false, barsDone = false, io;
function observe() {
  if (!io) io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; el.classList.add("in"); io.unobserve(el);
    if (el.classList.contains("stat") && !counted) countUp();
    if (el.id === "sk") fillBars();
  }), { threshold: .15, rootMargin: "0px 0px -40px 0px" });
  $$(".rv:not(.in)").forEach((el, i) => { el.style.transitionDelay = (el.closest(".hero") ? i * 70 : 0) + "ms"; io.observe(el); });
  // stagger grids
  ["#stats", "#svc", "#ct", "#pj"].forEach(g => $$(g + " > .rv").forEach((el, i) => el.style.transitionDelay = i * 90 + "ms"));
}
function countUp() {
  counted = true;
  $$(".count").forEach(el => {
    const n = +el.dataset.n, t0 = performance.now(), dur = reduced ? 0 : 1600;
    (function step(now) {
      const p = dur ? Math.min((now - t0) / dur, 1) : 1;
      el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}
function fillBars() { barsDone = true; $$(".bar i").forEach(b => b.style.width = b.dataset.p + "%"); }

addEventListener("resize", movePill);

/* =========================================================
   INIT
   ========================================================= */
$$(".lang button").forEach(b => b.addEventListener("click", () => b.dataset.lang !== LANG && render(b.dataset.lang, true)));
let saved = null; try { saved = localStorage.getItem("lang"); } catch (e) {}
render(["vi", "en", "ja"].includes(saved) ? saved : "vi");
document.fonts && document.fonts.ready.then(movePill);
</script>
