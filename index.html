<style>
:root{--b:#2563eb;--b2:#06b6d4;--bs:#eaf1ff;--bg:#f7f8fb;--s:#fff;--k:#0f172a;--k2:#334155;--m:#64748b;--l:#e5e9f0;--r:18px;
  --sh:0 1px 2px #0f172a0a,0 8px 24px -12px #0f172a1f;--shl:0 24px 48px -20px #2563eb47;--e:cubic-bezier(.2,.7,.2,1);
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--k);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(600px 400px at 85% -5%,#dbe7ff,transparent 70%),radial-gradient(500px 400px at -10% 35%,#dff7fc,transparent 70%),var(--bg) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.6;
  background:linear-gradient(var(--l) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,var(--l) 1px,transparent 1px) 0 0/44px 44px;
  -webkit-mask:radial-gradient(ellipse 80% 55% at 50% 0,#000 30%,transparent 75%);mask:radial-gradient(ellipse 80% 55% at 50% 0,#000 30%,transparent 75%)}
html[lang=ja] body{font-family:"Be Vietnam Pro","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none}
::selection{background:var(--b);color:#fff}
main,footer{max-width:960px;margin:auto;padding:0 22px}
:focus-visible{outline:2px solid var(--b);outline-offset:3px;border-radius:8px}

/* Language flags */
.lang{position:fixed;top:16px;right:18px;z-index:9;display:flex;gap:6px;padding:6px;border-radius:99px;background:#ffffffd9;border:1px solid var(--l);box-shadow:var(--sh)}
.lang button{width:34px;height:24px;border-radius:6px;overflow:hidden;opacity:.5;box-shadow:0 0 0 1px #0f172a1f;transition:.2s}
.lang button:hover{opacity:.9}
.lang .on{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--b)}
.lang svg{display:block;width:100%;height:100%}

/* Hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding-top:96px}
.status{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--b);background:var(--bs);border:1px solid #d6e4ff;border-radius:99px;padding:6px 14px 6px 12px;margin-bottom:22px}
.status i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--b)}
.status i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--b);animation:ping 2s infinite}
@keyframes ping{to{transform:scale(2.6);opacity:0}}
.hello{font-size:18px;color:var(--m)}
h1{font-size:clamp(42px,8vw,72px);line-height:1.04;font-weight:800;letter-spacing:-.045em;margin:6px 0 16px;
  background:linear-gradient(100deg,var(--k) 30%,var(--b) 70%,var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.social{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.social a{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--k2);background:var(--s);border:1px solid var(--l);box-shadow:var(--sh);transition:.25s var(--e)}
.social a:hover{transform:translateY(-4px);background:var(--c);border-color:var(--c);color:#fff}
.social a::after{content:attr(aria-label);position:absolute;bottom:calc(100% + 8px);left:50%;translate:-50% 4px;white-space:nowrap;font-size:12px;font-weight:600;color:#fff;background:var(--k);padding:4px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:.2s}
.social a:hover::after{opacity:1;translate:-50% 0}
svg.i{width:20px;height:20px;fill:currentColor}
.typed{font-size:clamp(18px,3vw,22px);font-weight:600;color:var(--k2);min-height:1.6em}
#tw{color:var(--b);border-right:2px solid var(--b);padding-right:3px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}
.bio{max-width:540px;margin-top:16px;color:var(--k2);font-size:16.5px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 20px;border-radius:12px;border:1px solid var(--l);background:var(--s);transition:.2s var(--e)}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:var(--k);border-color:var(--k);color:#fff}
.btn.p:hover{background:var(--b);border-color:var(--b)}
.av{position:relative;width:220px;aspect-ratio:1;border-radius:32px;display:grid;place-items:center;color:#fff;font-size:96px;font-weight:800;
  background:linear-gradient(140deg,var(--b),var(--b2));box-shadow:var(--shl)}
.av::before{content:"";position:absolute;inset:-10px;border-radius:40px;border:1.5px dashed #bcd0f5;animation:spin 40s linear infinite}
@keyframes spin{to{rotate:360deg}}
.chip{position:absolute;font-size:12.5px;font-weight:600;color:var(--k);background:var(--s);border:1px solid var(--l);border-radius:99px;padding:6px 12px;box-shadow:var(--sh)}
.c1{top:18px;left:-34px}.c2{bottom:28px;right:-38px}.c3{bottom:-14px;left:10px}

/* Sections */
section{padding-top:84px}
.ey{font:500 12.5px var(--mono);color:var(--b);margin-bottom:10px}
h2{font-size:clamp(26px,4.5vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:28px}
.card{position:relative;background:var(--s);border:1px solid var(--l);border-radius:var(--r);box-shadow:var(--sh)}
[data-tilt]{transition:transform .5s var(--e),box-shadow .3s,border-color .3s}
[data-tilt].t{transition:transform .08s linear,box-shadow .3s,border-color .3s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(400px circle at var(--x,50%) var(--y,50%),#2563eb22,transparent 45%)}
.card:hover{box-shadow:var(--shl);border-color:#cfdcf5}
.card:hover::before{opacity:1}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr);gap:14px;margin-top:64px}
.g2{grid-template-columns:repeat(2,1fr)}
.st{padding:22px 20px}
.st b{display:block;font-size:clamp(30px,5vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.st em{font-style:normal;color:var(--b)}
.st>span{font-size:14px;color:var(--m)}
.sv{padding:26px}
.sv .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;color:var(--b);background:var(--bs)}
.sv .ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sv h3{font-size:18px;margin-bottom:6px}
.sv p,.pj p{color:var(--m);font-size:15px}
.sv small{position:absolute;top:22px;right:24px;font:12.5px var(--mono);color:#b6c2d6}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:22px 40px;padding:30px}
.lb{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:9px}
.lb span{font:13px var(--mono);color:var(--b)}
.bar{height:8px;border-radius:99px;background:#eef2f8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--b),var(--b2));transform-origin:left;scale:0 1;transition:scale 1.4s var(--e)}
.in .bar i{scale:1 1}
.pj,.ct{display:flex;align-items:center;gap:18px;padding:20px 22px}
.pj .th{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(140deg,#ef4444,#f97316)}
.pj h3{font-size:18px}
.url{font:12.5px var(--mono);color:var(--b)}
.tx{flex:1;min-width:0}
.ct .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.ct b{display:block}
.ct .tx span{display:block;font-size:13.5px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--l);transition:.35s var(--e)}
.go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.card:hover .go{background:var(--b);border-color:var(--b);color:#fff;rotate:45deg}
.gc{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:96px;padding-top:26px;padding-bottom:40px;border-top:1px solid var(--l);color:var(--m);font-size:13.5px}
footer a{color:var(--k);font-weight:600}

/* Reveal */
.rv{opacity:0;translate:0 22px;transition:opacity .8s var(--e),translate .8s var(--e);transition-delay:var(--d,0s)}
.rv.in{opacity:1;translate:0}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}.rv{opacity:1;translate:0}.bar i{scale:1 1}}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:76px}.art{order:-1}
  .av{width:150px;font-size:64px;border-radius:26px}.av::before{border-radius:32px}
  .chip{font-size:11.5px;padding:5px 10px}.c1{left:auto;right:-110px;top:14px}.c2{right:-118px;bottom:56px}.c3{left:auto;right:-80px;bottom:6px}
  .g4{grid-template-columns:1fr 1fr}.g2,.sk{grid-template-columns:1fr}
  section{padding-top:68px}.lang{top:12px;right:12px}
}
@media (max-width:420px){.pj .go{display:none}}
</style>
</head>

          ["AI活用", "AIでコンテンツ作成、業務の自動化、ワークフローの最適化を行い、作業を大幅にスピードアップ。"],
          ["MMO", "オンライン収益化の実践経験をもとに、方向性やツール選びをアドバイス。"],
          ["フリーランス案件", "ご要望に応じて、シンプルなウェブサイト、コンテンツ制作、業務向けAIツール導入を承ります。"]] }
};

/* ===== ENGINE ===== */
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
const icon = d => `<svg class="i" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const ARROW = '<span class="go"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></span>';
const ext = u => u.startsWith("http") ? ' target="_blank" rel="noopener"' : "";
const short = u => u.replace(/^(mailto:|https?:\/\/(www\.)?)/, "");
let L, done = {}, timer;

function render(l) {
  const t = T[L = l];
  document.documentElement.lang = l;
  try { localStorage.lang = l } catch (e) {}
  $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l == l));
  $$("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  document.title = "Nguyễn Hữu Văn — " + t.words.join(" · ");
  const links = LINKS.filter(x => x[1]).map(([n, u, c, d]) => [n == "email" ? t.email : n, u, c, d]);

  $("#soc").innerHTML = links.map(([n, u, c, d]) => `<a href="${u}"${ext(u)} style="--c:${c}" aria-label="${n}">${icon(d)}</a>`).join("");
  $("#stats").innerHTML = STATS.map(([n, s], i) => `<div class="card st rv" data-tilt="8"><b><span data-n="${n}">${done.n ? n : 0}</span><em>${s}</em></b><span>${t.stats[i]}</span></div>`).join("");
  $("#svc").innerHTML = t.svc.map(([h, p], i) => `<div class="card sv rv" data-tilt="7"><small>0${i + 1}</small><div class="ic"><svg viewBox="0 0 24 24">${SVC_ICONS[i]}</svg></div><h3>${h}</h3><p>${p}</p></div>`).join("");
  $("#sk").innerHTML = SKILLS.map(([n, p]) => `<div><p class="lb">${n}<span>${p}%</span></p><div class="bar"><i style="width:${p}%"></i></div></div>`).join("");
  $("#pj").innerHTML = `<a class="card pj rv" data-tilt="5" href="${PROJECT.url}"${ext(PROJECT.url)}><span class="th">${PROJECT.thumb}</span><span class="tx"><h3>${PROJECT.name}</h3><p>${t.pj}</p><span class="url">${short(PROJECT.url)}</span></span>${ARROW}</a>`;
  $("#ct").innerHTML = links.map(([n, u, c, d]) => `<a class="card ct rv" data-tilt="6" href="${u}"${ext(u)}><span class="ic">${icon(d)}</span><span class="tx"><b>${n}</b><span>${short(u)}</span></span>${ARROW}</a>`).join("");
  $("#yr").textContent = new Date().getFullYear();

  $$(".grid").forEach(g => [...g.children].forEach((c, i) => c.style.setProperty("--d", i * .09 + "s")));
  $$(".rv:not(.in)").forEach(e => io.observe(e));
  type();
}

/* Reveal + counters + bars (one observer) */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target; el.classList.add("in"); io.unobserve(el);
  if (el.classList.contains("st") && !done.n) { done.n = 1; count(); }
}), { threshold: .15, rootMargin: "0px 0px -40px 0px" });

function count() {
  const t0 = performance.now();
  (function f(now) {
    const p = still ? 1 : Math.min((now - t0) / 1600, 1), k = 1 - (1 - p) ** 3;
    $$("[data-n]").forEach(e => e.textContent = Math.round(e.dataset.n * k));
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

/* Typewriter */
function type() {
  clearTimeout(timer);
  const w = T[L].words, el = $("#tw");
  if (still) return el.textContent = w[0];
  let i = 0, j = 0, del = 0;
  (function f() {
    el.textContent = w[i].slice(0, j += del ? -1 : 1);
    let ms = del ? 38 : 85;
    if (!del && j == w[i].length) del = 1, ms = 1600;
    else if (del && !j) del = 0, i = (i + 1) % w.length, ms = 350;
    timer = setTimeout(f, ms);
  })();
}

/* 3D tilt + glare — one delegated listener, rAF throttled */
if (!still && matchMedia("(hover:hover)").matches) {
  let card, ev, raf;
  document.addEventListener("pointermove", e => {
    const c = e.target.closest("[data-tilt]");
    if (c != card) { if (card) card.classList.remove("t"), card.style.transform = ""; card = c; c && c.classList.add("t"); }
    ev = e; if (card && !raf) raf = requestAnimationFrame(() => {
      raf = 0; if (!card) return;
      const r = card.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height, m = card.dataset.tilt;
      card.style.transform = `perspective(900px) rotateX(${(.5 - y) * m}deg) rotateY(${(x - .5) * m}deg)`;
      card.style.setProperty("--x", x * 100 + "%"); card.style.setProperty("--y", y * 100 + "%");
    });
  }, { passive: true });
}

$$(".lang button").forEach(b => b.onclick = () => b.dataset.l != L && render(b.dataset.l));
let s; try { s = localStorage.lang } catch (e) {}
render(T[s] ? s : "vi");
</script>
</body>
</html>
